function validateSession(s){
 if(!s||typeof s!=='object'||Array.isArray(s))throw Error('记录格式错误');
 if(typeof s.id!=='string'||!/^[-\w]{8,80}$/.test(s.id))throw Error('训练编号无效');
 if(typeof s.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s.date)||!Number.isFinite(Date.parse(s.date))||new Date(s.date).toISOString().slice(0,10)!==s.date)throw Error('日期无效');
 if(!['A','B','C','D','custom'].includes(s.planId))throw Error('训练日无效');
 if(!['draft','finished'].includes(s.status))throw Error('训练状态无效');
 if(!Number.isInteger(s.revision)||s.revision<0)throw Error('记录版本无效');
 if(typeof s.note!=='string'||s.note.length>3000)throw Error('备注过长');
 if(!Array.isArray(s.exercises)||s.exercises.length>50)throw Error('动作数量超出范围');
 const ids=new Set();
 for(const e of s.exercises){
  if(!e||typeof e.id!=='string'||!/^[-\w]{8,80}$/.test(e.id)||ids.has(e.id))throw Error('动作编号错误或重复');ids.add(e.id);
  if(typeof e.name!=='string'||!e.name.trim()||e.name.length>80)throw Error('动作名称无效');
  if(typeof e.exerciseId!=='string'||e.exerciseId.length>80)throw Error('动作类型无效');
  if(!['背部','肩中束','肩后束','肩部推举','胸部','下肢','核心','体态控制','手臂','其他'].includes(e.group))throw Error('肌群无效');
  if(!['total','single','body','assist'].includes(e.mode)||typeof e.unilateral!=='boolean')throw Error('计重方式无效');
  if(typeof e.note!=='string'||e.note.length>1000)throw Error('动作备注过长');
  if(!Number.isFinite(e.pain)||e.pain<0||e.pain>10)throw Error('不适评分无效');
  if(!Number.isInteger(e.targetSets)||e.targetSets<0||e.targetSets>20||!Number.isFinite(e.min)||!Number.isFinite(e.max)||e.min<0||e.max<e.min||e.max>300)throw Error('目标组次无效');
  if(!Array.isArray(e.sets)||e.sets.length>20)throw Error('每个动作最多20组');
  const setIds=new Set();
  for(const set of e.sets){
   if(!set||typeof set.id!=='string'||!/^[-\w]{8,80}$/.test(set.id)||setIds.has(set.id))throw Error('组编号错误');setIds.add(set.id);
   if(typeof set.done!=='boolean')throw Error('完成状态无效');
   for(const key of ['kg','reps','left','right','rir']){const v=set[key];if(v!==null&&(!Number.isFinite(v)||v<0||v>({kg:1000,reps:300,left:300,right:300,rir:10}[key])))throw Error('重量、次数或余力超出范围');}
   if(e.mode==='body'&&set.kg!==null&&set.kg!==0)throw Error('徒手动作请切换计重方式再填写重量');
   if(set.done&&((e.unilateral?!(set.left>0&&set.right>0):!(set.reps>0))||(e.mode!=='body'&&set.kg===null)))throw Error('勾选前请填写有效重量及次数；单侧动作需要左右次数');
  }
 }
 if(s.status==='finished'&&!s.exercises.some(e=>e.sets.some(t=>t.done)))throw Error('至少完成一组才能结束训练');
 return s;
}
function summarize(sessions,now=new Date().toISOString().slice(0,10)){
 const today=new Date(now+'T12:00:00Z');const monday=new Date(today);monday.setUTCDate(today.getUTCDate()-((today.getUTCDay()+6)%7));const start=monday.toISOString().slice(0,10);
 const finished=sessions.filter(s=>s.status==='finished'&&s.date<=now);
 const week=finished.filter(s=>s.date>=start);const groups={};let volume=0,sets=0,sideDiff=0,paired=0;const warnings=[];
 for(const s of week)for(const e of s.exercises){const done=e.sets.filter(t=>t.done);sets+=done.length;groups[e.group]=(groups[e.group]||0)+done.length;
  if(e.pain>0&&done.length)warnings.push({date:s.date,name:e.name,pain:e.pain});
  for(const t of done){if(!['body','assist'].includes(e.mode)){const reps=e.unilateral?t.left+t.right:t.reps;const multiplier=e.mode==='single'&&!e.unilateral?2:1;volume+=t.kg*reps*multiplier;}if(e.unilateral){paired++;sideDiff+=Math.abs(t.left-t.right);}}
 }
 const weeks=[];for(let n=5;n>=0;n--){const a=new Date(monday);a.setUTCDate(a.getUTCDate()-n*7);const b=new Date(a);b.setUTCDate(a.getUTCDate()+7);const from=a.toISOString().slice(0,10),to=b.toISOString().slice(0,10);const list=finished.filter(s=>s.date>=from&&s.date<to);weeks.push({date:from,count:list.length,sets:list.reduce((a,s)=>a+s.exercises.reduce((b,e)=>b+e.sets.filter(t=>t.done).length,0),0)});}
 return {weekStart:start,weekSessions:week.length,totalSessions:finished.length,sets,volume:Math.round(volume),groups,weeks,paired,sideDiff,warnings};
}

// Phone-first journal: acknowledge a save only after durable local storage commits.
function sameRecord(a,b){const clean=v=>Array.isArray(v)?v.map(clean):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,clean(v[k])])):v;const left={...a},right={...b};delete left.revision;delete right.revision;return JSON.stringify(clean(left))===JSON.stringify(clean(right));}
class IndexedDBStorage {
 constructor(scope){this.scope=scope;this.connection=null;}
 async open(){if(this.connection)return this.connection;this.connection=await new Promise((resolve,reject)=>{const r=indexedDB.open('form-friend-journal-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('journals');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(Error('无法打开手机存储。请使用普通 Safari 窗口并允许网站存储。'));});return this.connection;}
 async read(){const db=await this.open();return new Promise((resolve,reject)=>{const t=db.transaction('journals','readonly'),r=t.objectStore('journals').get(this.scope);t.oncomplete=()=>resolve(r.result||null);t.onerror=()=>reject(Error('读取手机记录失败'));});}
 async write(value,expectedRevision=0){const db=await this.open();return new Promise((resolve,reject)=>{const t=db.transaction('journals','readwrite'),store=t.objectStore('journals'),r=store.get(this.scope);let conflict=false;r.onsuccess=()=>{if((r.result?.storageRevision||0)!==expectedRevision){conflict=true;t.abort();return}store.put(value,this.scope);};t.oncomplete=()=>resolve();t.onabort=t.onerror=()=>reject(Error(conflict?'另一页面已修改手机记录。请导出本页草稿，再刷新，避免覆盖。':'手机存储失败，可能空间不足。请保留本页并立即导出备份。'));});}
}
class OfflineJournal {
 constructor({storage,remote,onChange=()=>{}}){this.storage=storage;this.remote=remote;this.onChange=onChange;this.state=null;this.lock=Promise.resolve();this.syncing=null;this.lastError='';}
 async ready(){if(!this.state)this.state=await this.storage.read()||{initialized:false,entries:{},lastSynced:null};}
 async mutate(fn){const work=this.lock.then(async()=>{await this.ready();const next=structuredClone(this.state);const result=fn(next);const revision=this.state.storageRevision||0;next.storageRevision=revision+1;await this.storage.write(next,revision);this.state=next;this.changed();return result;});this.lock=work.catch(()=>{});return work;}
 changed(){this.onChange(this.snapshot());}
 snapshot(){const items=Object.values(this.state?.entries||{});return {pending:items.filter(e=>e.pending&&!e.conflict).length,conflicts:items.filter(e=>e.conflict).length,lastSynced:this.state?.lastSynced||null,error:this.lastError,syncing:!!this.syncing};}
 list(){return Object.values(this.state?.entries||{}).filter(e=>!e.deleted).map(e=>({...structuredClone(e.data),revision:e.localRevision})).sort((a,b)=>b.date.localeCompare(a.date));}
 async bootstrap(){await this.ready();if(!this.state.initialized){const data=await this.remote('/api/bootstrap');await this.merge(data.sessions||[]);}return {sessions:this.list()};}
 async merge(records){await this.mutate(state=>{state.initialized=true;const ids=new Set(records.map(s=>s.id));for(const s of records){const local=state.entries[s.id];if(local?.pending||local?.conflict){local.remoteCopy=s;if(!local.deleted&&sameRecord(local.data,s)){local.remoteRevision=s.revision;local.pending=false;local.conflict=false;}continue;}if(!local||local.remoteRevision!==s.revision)state.entries[s.id]={data:s,localRevision:local?local.localRevision+1:s.revision,remoteRevision:s.revision,generation:0,pending:false,deleted:false,conflict:false};}for(const [id,e] of Object.entries(state.entries))if(!ids.has(id)&&!e.pending&&!e.conflict)delete state.entries[id];state.lastSynced=new Date().toISOString();});}
 async save(s){return this.mutate(state=>{const old=state.entries[s.id];if((old?.localRevision||0)!==s.revision){const e=Error('这条记录已在其他页面更新。请导出当前草稿，再重新打开训练记录。');e.status=409;throw e;}const revision=(old?.localRevision||0)+1;state.entries[s.id]={...old,data:{...s,revision},localRevision:revision,remoteRevision:old?.remoteRevision||0,generation:(old?.generation||0)+1,pending:true,deleted:false,conflict:old?.conflict||false};return {revision};});}
 async remove(id,revision){return this.mutate(state=>{const e=state.entries[id];if(!e||e.localRevision!==revision)throw Error('记录版本已改变，请重新打开后操作。');e.deleted=true;e.pending=true;e.generation++;e.localRevision++;return {ok:true};});}
 async sync(){if(this.syncing)return this.syncing;
  this.syncing=this.performSync();this.changed();try{return await this.syncing}finally{this.syncing=null;this.changed();}
 }
 async performSync(){await this.ready();this.lastError='';let rounds=0;
  try{while(rounds++<100){await this.lock;const e=Object.values(this.state.entries).find(e=>e.pending&&!e.conflict);if(!e)break;const entry=structuredClone(e),id=entry.data.id;
   if(entry.deleted&&entry.remoteRevision===0){await this.mutate(s=>{if(s.entries[id]?.generation===entry.generation)delete s.entries[id];});continue;}
   try{const reply=entry.deleted?await this.remote('/api/sessions/'+encodeURIComponent(id)+'?revision='+entry.remoteRevision,{method:'DELETE'}):await this.remote('/api/sessions',{method:'POST',body:JSON.stringify({...entry.data,revision:entry.remoteRevision})});
    await this.mutate(s=>{const now=s.entries[id];if(!now)return;if(entry.deleted){if(now.generation===entry.generation)delete s.entries[id];else{now.remoteRevision=0;now.pending=true;}}else{now.remoteRevision=reply.revision;if(now.generation===entry.generation)now.pending=false;}});
   }catch(error){if(error.status===409){const result=await this.remote('/api/bootstrap'),cloud=(result.sessions||[]).find(s=>s.id===id);await this.mutate(s=>{const now=s.entries[id];if(!now)return;if(entry.deleted&&!cloud){if(now.generation===entry.generation)delete s.entries[id];else now.remoteRevision=0;}else if(!entry.deleted&&cloud&&sameRecord(entry.data,cloud)){now.remoteRevision=cloud.revision;if(now.generation===entry.generation)now.pending=false;}else{now.conflict=true;now.remoteCopy=cloud||null;}});continue;}throw error;}
  }
  const cloud=await this.remote('/api/bootstrap');await this.merge(cloud.sessions||[]);this.lastError='';
  }catch(error){this.lastError=error.status===401?'访问口令失效，手机记录仍已保留。请用有效专属链接重新打开。':error.message||'网络不可用，已保留手机记录，联网后重试。';throw error;}
 }
 async resolveConflicts(){const cloud=await this.remote('/api/bootstrap'),map=new Map((cloud.sessions||[]).map(s=>[s.id,s]));await this.mutate(state=>{for(const [id,e] of Object.entries(state.entries)){if(!e.conflict)continue;if(!e.deleted){const newId=crypto.randomUUID();state.entries[newId]={data:{...e.data,id:newId,revision:1,conflictCopy:true},localRevision:1,remoteRevision:0,generation:1,pending:true,deleted:false,conflict:false};}const remote=map.get(id);if(remote)state.entries[id]={data:remote,localRevision:e.localRevision+1,remoteRevision:remote.revision,generation:0,pending:false,deleted:false,conflict:false};else delete state.entries[id];}});}
}

async function api(path,options={}){

async function flush(){clearTimeout(saveTimer);if(savePromise){await savePromise;if(dirty)return flush();return}if(!dirty||!current)return;
 savePromise=(async()=>{while(dirty&&current){const reference=current;const snapshot=JSON.stringify(reference);const id=reference.id;status('正在保存…');try{validateSession(reference);const result=await api('/api/sessions',{method:'POST',body:snapshot});const unchanged=current?.id===id&&JSON.stringify(current)===snapshot;reference.revision=result.revision;const index=sessions.findIndex(s=>s.id===id);const stored={...JSON.parse(snapshot),revision:result.revision};if(index<0)sessions.unshift(stored);else sessions[index]=stored;if(unchanged){dirty=false;localCopy();journal?syncIndicator():status('已保存到云端');}else{localCopy();}}catch(error){status('保存失败 · 请重试',true);loadError=error.message;localCopy();showError();throw error}}})();
 try{await savePromise}finally{savePromise=null}
}

-action="add-exercise">＋ 添加计划外动作 / 替换动作</button>${p?.cardio?`<div class="banner success-banner">恢复建议：${esc(p.cardio)}</div>`:''}<div class="card note-panel"><h3>训练感受</h3><textarea id="session-note" placeholder="例如：器械座位档位、超级组轮次、训练感受…" maxlength="3000">${esc(s.note)}</textarea></div><div class="session-bottom"><button class="button secondary" data-action="save">保存记录</button><button class="button primary" data-action="finish" ${busy?'disabled':''}>${s.status==='finished'?'重新打开训练':'结束本次训练'} <span aria-hidden="true">↗</span></button></div></section><aside><div class="aside-card"><div class="progress-header"><h3 style="margin:0">记录行完成度</h3><span class="num" id="progress-number">${total?Math.round(done/total*100):0}<small>%</small></span></div><div class="progress"><i id="progress-bar" style="width:${total?done/total*100:0}%"></i></div><p>只统计你已打勾的正式组。热身不计入训练量。</p></div><div class="aside-card dark"><h3>今天的控制重点</h3><div class="focus-row">单边动作分别记录左右次数</div><div class="focus-row">不靠转胸、甩腰完成重复</div><div class="focus-row">肩胛自然运动，不强压肩</div><p>有疼痛、卡顿或明显无力时，停止诱发动作。无痛弹响单独记录。</p></div><div class="aside-card"><h3>训练前 · 约8分钟</h3><ol class="warmup-list"><li>快走 / 单车 3—5分钟</li><li>当天主要动作的轻重量热身</li><li>按器械说明调整座位与活动范围</li><li>首个大动作逐级热身 2—3组</li></ol><button class="small-link" data-nav="plan">查看动作要点 ↗</button></div><div class="aside-card"><h3>怎么记录重量？</h3><p>哑铃默认填单只重量；杠铃填含杆总重；器械按标示值。单侧动作分别填左右次数。辅助引体填辅助重量，数字越小辅助越少。</p><p>RIR = 结束时估计还能规范完成的次数；不确定可留空。</p></div></aside></div>`}
function exerciseCard(e,index){const lib=findLib(e.exerciseId);return `<article class="card" data-exercise="${e.id}"><div class="exercise-head"><div class="exercise-title"><span class="exercise-index">${String(index+1).padStart(2,'0')}</span><div><h3>${esc(e.name)}</h3><div class="tags"><span class="tag">${esc(e.group)}</span><span class="tag">${e.targetSets>0?e.targetSets+'组 × '+e.min+'—'+e.max+'次':'组次待确认'}</span>${e.extra?'<span class="tag extra">计划外</span>':''}${e.unilateral?'<span class="tag">左右分记</span>':''}</div></div></div><button class="delete-btn" data-action="remove-exercise" aria-label="移除${esc(e.name)}">×</button></div><details class="tips"><summary>动作要点与注意事项</summary><ul>${(lib?.tips||['选择可控制、无痛的动作范围，记录实际重量与次数。','自定义动作需要按实际器械和做法选择计重方式；不与不同做法直接比较。']).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details><div class="weight-mode"><span>目标之外的实际组数也可记录</span><select data-field="mode" aria-label="${esc(e.name)}计重方式">${Object.entries(modes).map(([k,v])=>`<option value="${k}" ${e.mode===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="set-table"><div class="set-head ${e.unilateral?'unilateral':''}"><span>组</span><span>${e.mode==='assist'?'辅助 kg':e.mode==='body'?'徒手':'重量 kg'}</span>${e.unilateral?'<span>右 / 次</span><span>左 / 次</span>':'<span>次数</span>'}<span title="还可以完成的次数">余力 RIR</span><span>完成</span><span></span></div>${e.sets.map((t,i)=>setRow(e,t,i)).join('')}<button class="add-set" data-action="add-set">＋ 再加一组</button></div><div class="exercise-foot"><label>不适 <select data-field="pain" aria-label="${esc(e.name)}不适评分">${Array.from({length:11},(_,i)=>`<option value="${i}" ${e.pain===i?'selected':''}>${i===0?'0 · 无痛':i+' / 10'}</option>`).join('')}</select></label><label><input type="checkbox" data-field="click" ${e.click?'checked':''}>有弹响</label><span>疼痛评分不等于损伤程度</span></div><input class="exercise-note" data-field="note" aria-label="${esc(e.name)}备注" placeholder="动作备注：器械设置、动作控制、左右感受…" maxlength="1000" value="${esc(e.note)}"></article>`}
function setRow(e,t,i){const input=(field,label,max,disabled=false)=>`<input type="number" inputmode="decimal" min="0" max="${max}" step="${field==='kg'?'0.5':'1'}" data-set-field="${field}" value="${t[field]??''}" placeholder="${disabled?'—':'·'}" aria-label="${esc(e.name)}第${i+1}组${label}" ${disabled?'disabled':''}>`;return `<div class="set-row ${e.unilateral?'unilateral':''} ${t.done?'completed':''}" data-set="${t.id}"><span class="set-number">${String(i+1).padStart(2,'0')}</span>${input('kg','重量',1000,e.mode==='body')}${e.unilateral?input('right','右侧次数',300)+input('left','左侧次数',300):input('reps','次数',300)}${input('rir','剩余次数',10)}<label class="check"><input type="checkbox" data-set-field="done" ${t.done?'checked':''} aria-label="${esc(e.name)}第${i+1}组完成"></label><button class="row-remove" data-action="remove-set" aria-label="删除第${i+1}组">×</button></div>`}

function historyView(){const list=sessions.filter(s=>(!historyFrom||s.date>=historyFrom)&&(!historyPlan||s.planId===historyPlan)).sort((a,b)=>b.date.localeCompare(a.date));return `${header('YOUR TRAINING LOG','每一次，都有迹可循。','查看、补记和修改历史训练。草稿与已结束记录分开标注。',`<button class="button secondary" data-action="new-session">＋ 补记训练</button>`)}<div class="history-filters"><label style="font-size:12px;color:var(--muted)">起始日期 <input id="history-from" type="date" value="${esc(historyFrom)}" aria-label="历史起始日期"></label><select id="history-plan" aria-label="筛选训练日"><option value="">全部训练日</option>${[...PLANS,{id:'custom',name:'自由训练'}].map(p=>`<option value="${p.id}" ${historyPlan===p.id?'selected':''}>${p.id==='custom'?'自由训练':p.id+' · '+p.name}</option>`).join('')}</select><button class="small-link" data-action="clear-filters">清除筛选</button></div>${list.length?`<div class="history-list">${list.map(s=>`<article class="history-card"><div class="history-date"><div class="num">${s.date.slice(8)}</div><small>${s.date.slice(0,7)}</small></div><div class="history-content"><h3>${esc(s.planId==='custom'?'自由训练':s.planId+' · '+planName(s))} <span class="tag">${s.status==='finished'?'已结束':'草稿'}</span></h3><p>${s.exercises.length} 个动作 · ${count(s)} 个完成组${s.note?' · '+esc(s.note.slice(0,38)):''}</p></div><div class="history-actions"><button class="button secondary" data-open-session="${s.id}">查看 / 编辑 ↗</button><button class="delete-btn" data-delete-session="${s.id}" aria-label="删除${s.date}训练">×</button></div></article>`).join('')}</div>`:empty('还没有匹配的训练记录','完成第一组后，记录会自动保存到这里。你也可以补记之前的训练。','开始记录','train')}`}
function empty(title,desc,button,nav){return `<div class="empty"><span class="empty-icon" aria-hidden="true">↗</span><h2>${title}</h2><p>${desc}</p><button class="button primary" data-nav="${nav}">${button} ↗</button></div>`}
function insightsView(){const sum=summarize(sessions,today()),finished=sessions.filter(s=>s.status==='finished'&&s.date<=today());const max=Math.max(...sum.weeks.map(w=>w.sets),1);const exercises=[...new Map(finished.flatMap(s=>s.exercises.filter(e=>e.sets.some(t=>t.done)).map(e=>[e.exerciseId+'|'+e.mode,{id:e.exerciseId,mode:e.mode,name:e.name}]))).values()];if(!exercises.some(e=>e.id+'|'+e.mode===trendId))trendId=exercises[0]?exercises[0].id+'|'+exercises[0].mode:'';
 return `${header('REVIEW & PROGRESS','让记录，指引下一步。','只分析已结束训练中的已完成组；草稿不计入趋势。',`<button class="button secondary" data-action="report">导出复盘摘要 ↗</button>`)}<div class="stats"><div class="stat"><div class="stat-label">本周训练</div><div class="value">${sum.weekSessions}<span>次</span></div></div><div class="stat"><div class="stat-label">本周完成组数</div><div class="value">${sum.sets}<span>组</span></div></div><div class="stat"><div class="stat-label">本周外部负重总量</div><div class="value">${fmt(sum.volume)}<span>kg·次</span></div></div><div class="stat"><div class="stat-label">累计已结束训练</div><div class="value">${sum.totalSessions}<span>次</span></div></div></div>${!finished.length?empty('你的第一份复盘，从一组开始','记录动作、重量、次数和余力，结束训练后，这里会生成真实的训练量与进步趋势。','去训练','train'):''}<div class="two-col" style="margin-top:22px"><section class="card chart-card"><h3>近6周训练节奏</h3><p>每周完成组数 · 从周一开始</p><div class="chart">${sum.weeks.map(w=>`<div class="chart-col"><span class="count">${w.sets}</span><div class="chart-bar" style="height:${Math.max(2,w.sets/max*120)}px"></div><small>${w.date.slice(5)}</small></div>`).join('')}</div><p style="margin-top:17px">不以连续打卡为目标，优先恢复和稳定执行。</p></section><section class="card chart-card"><h3>本周训练分布</h3><p>单侧动作左右均完成算一个配对组，不重复计组</p>${Object.entries(sum.groups).filter(([,n])=>n>0).map(([g,n])=>`<div class="muscle-row"><div class="muscle-label"><span>${g}</span><span>${n} 组</span></div><div class="muscle-bar"><i style="width:${n/Math.max(...Object.values(sum.groups),1)*100}%"></i></div></div>`).join('')||'<p style="padding-top:35px">本周暂无已结束训练。</p>'}</section></div><div class="section-title" style="margin-top:20px"><h2>训练观察</h2><small>基于记录的规则分析</small></div>${observations(sum,finished).map(x=>`<div class="insight ${x.warn?'warning':''}"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div>`).join('')}<section class="card chart-card" style="margin-top:25px"><h3>单个动作的进步</h3><p>只比较相同动作与计重方式；不同机器或设置请写入备注，避免直接比较。</p><select class="trend-select" id="trend-select" aria-label="选择趋势动作"><option value="">选择已记录动作</option>${exercises.map(e=>`<option value="${esc(e.id+'|'+e.mode)}" ${trendId===e.id+'|'+e.mode?'selected':''}>${esc(e.name)} · ${modes[e.mode]}</option>`).join('')}</select>${trendTable(finished)}</section><div class="card guide"><h3>如何让我继续分析</h3><p>朋友版记录独立保存，不混入原账号的聊天读取结果。如需分析，请经朋友同意后导出复盘摘要，再发到聊天里。</p><p>这里的自动分析是规则计算，不会诊断胸廓旋转、肩部损伤，也不会在没有数据时编造进步。外部负重总量仅用于同类训练参考，排除徒手和辅助重量；不能代表完整训练刺激。</p></div>`}
function observations(sum,finished){const out=[];if(!finished.length)return [{title:'先建立你的基线',text:'至少记录并结束一次训练，才能观察实际训练量。相同动作有两次以上记录后，再比较进步。'}];
 if(sum.warnings.length)out.push({warn:true,title:'优先处理训练中的不适',text:sum.warnings.map(w=>`${w.date} ${w.name}：${w.pain}/10`).join('；')+'。暂不建议据此加重；调整诱发动作，有持续疼痛、卡顿或无力时接受专业评估。'});
 const shoulder=(sum.groups['肩中束']||0)+(sum.groups['肩后束']||0)+(sum.groups['肩部推举']||0);out.push({title:'胸背肩训练分布',text:`本周胸部 ${sum.groups['胸部']||0} 组，背部 ${sum.groups['背部']||0} 组，肩部相关动作 ${shoulder} 组。只统计实际完成，不把拉类动作的间接刺激重复算作后肩组数。周中偏少不代表需要赶进度补量。`});
 if(sum.paired)out.push({title:'左右次数的记录',text:sum.sideDiff?`本周 ${sum.paired} 个配对组，左右次数绝对差合计 ${sum.sideDiff} 次。先保持右侧动作稳定、左侧匹配，不直接据此给右侧加组。次数差不能单独代表力量差。`:`本周 ${sum.paired} 个配对组的左右记录次数一致。继续观察动作幅度、速度与主观感受，次数一致不等于力量完全相同。`});
 const candidates=[];const latest=[...finished].sort((a,b)=>b.date.localeCompare(a.date));const seen=new Set();for(const s of latest)for(const e of s.exercises){const key=e.exerciseId+'|'+e.mode;if(seen.has(key))continue;seen.add(key);const rows=latest.flatMap(s=>s.exercises.filter(x=>x.exerciseId===e.exerciseId&&x.mode===e.mode).map(x=>({date:s.date,e:x}))).slice(0,2);const hit=x=>x.e.targetSets>0&&x.e.pain===0&&x.e.sets.filter(t=>t.done).length>=x.e.targetSets&&x.e.sets.filter(t=>t.done).every(t=>(x.e.unilateral?t.left>=x.e.max&&t.right>=x.e.max:t.reps>=x.e.max)&&t.rir!==null&&t.rir>=2);if(rows.length===2&&rows.every(hit)&&e.mode!=='body'&&rows[0].date!==rows[1].date)candidates.push(e.name);}
 out.push(candidates.length?{title:'可以考虑小幅进阶的动作',text:candidates.join('、')+'：最近两个不同日期的记录达到次数上限、余力≥2且无痛。还需确认动作范围、计重方式与器械设置一致，再考虑最小档调整；辅助引体是减少辅助。'}:{title:'下一步：先稳定，再加重',text:'目前未出现满足连续两次达标条件的动作，或余力数据不足。继续记录真实余力；相同做法下达到全部目标组次数上限且仍有余力，再考虑最小档进阶。'});
 return out;
}
function trendTable(finished){if(!trendId)return '<p class="muted">有完成记录后显示动作趋势。</p>';const [id,mode]=trendId.split('|');const rows=finished.sort((a,b)=>b.date.localeCompare(a.date)).flatMap(s=>s.exercises.filter(e=>e.exerciseId===id&&e.mode===mode).map(e=>({date:s.date,e}))).slice(0,10);return `<div style="overflow:auto"><table class="trend-table"><thead><tr><th>日期</th><th>${mode==='assist'?'辅助 kg':mode==='body'?'计重':'kg（'+(mode==='single'?'单只':'总量')+'）'}</th><th>每组实际次数</th><th>不适</th></tr></thead><tbody>${rows.map(({date,e})=>{const ts=e.sets.filter(t=>t.done);return `<tr><td>${date}</td><td>${mode==='body'?'徒手':ts.map(t=>t.kg).join(' / ')}</td><td>${ts.map(t=>e.unilateral?'右'+t.right+' 左'+t.left:t.reps).join(' / ')}</td><td>${e.pain}/10${e.click?' · 弹响':''}</td></tr>`}).join('')}</tbody></table></div>`}
function updateProgress(){const n=count(current),all=target(current);if($('#metric-done'))$('#metric-done').innerHTML=n+'<span>/ '+all+' 组</span>';if($('#progress-number'))$('#progress-number').innerHTML=(all?Math.round(n/all*100):0)+'<small>%</small>';if($('#progress-bar'))$('#progress-bar').style.width=(all?n/all*100:0)+'%'}
async function navigate(next){try{await flush()}catch{toast('请先保存或导出当前草稿，再切换页面。');return}view=next;render();window.scrollTo({top:0,behavior:'smooth'})}
async function choosePlan(id,date=current.date){if(current.exercises.some(e=>e.sets.some(t=>t.done||t.kg!==null||t.reps!==null||t.left!==null||t.right!==null))||current.note){if(!confirm('将保存当前记录，并新建所选训练日。继续吗？'))return}try{await flush()}catch{return toast('当前草稿未保存，请先重试或导出。')}current=makeSession(id,date);dirty=false;view='train';render();window.scrollTo(0,0)}
function modal(content){$('#modal').innerHTML='<div class="modal-inner">'+content+'</div>';$('#modal').showModal()}
function modalTitle(text){return '<div class="modal-title"><h2>'+text+'</h2><button class="icon-btn" data-action="close-modal" aria-label="关闭">×</button></div>'}
function addModal(){const historical=[...new Map(sessions.flatMap(s=>s.exercises.filter(e=>e.exerciseId.startsWith('custom-')).map(e=>[e.exerciseId,e]))).values()];modal(`${modalTitle('添加一个动作')}<p>可以加入额外训练，也可以先删除原动作再添加替代动作。</p><form id="add-form"><label class="field">选择已有动作<select id="add-library"><option value="custom">＋ 自定义动作</option>${LIBRARY.map(l=>`<option value="${l.id}">${l.name} · ${l.group}</option>`).join('')}${historical.map(e=>`<option value="${esc(e.exerciseId)}">${esc(e.name)} · 历史自定义</option>`).join('')}</select></label><div id="custom-fields"><label class="field">动作名称<input id="custom-name" maxlength="80" required placeholder="例如：单臂地雷管推举"></label><label class="field">主要分类<select id="custom-group">${groups.map(g=>`<option>${g}</option>`).join('')}</select></label><label class="field">计重方式<select id="custom-mode">${Object.entries(modes).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label class="switch-row"><input id="custom-unilateral" type="checkbox">单侧动作，分别填写左右次数</label></div><div class="two-col" style="gap:12px"><label class="field">目标组数<input type="number" id="custom-sets" value="2" min="1" max="20" required></label><label class="field">目标次数<input type="number" id="custom-reps" value="12" min="1" max="300" required></label></div><button class="button primary" type="submit">加入本次训练 ＋</button></form>`)}
function exportModal(){modal(`${modalTitle('你的记录，由你保管')}<p>JSON 包含所有训练细节；CSV 方便用表格查看。导出包含尚未成功同步的当前草稿，请妥善保管个人记录。</p><button class="button primary" data-action="export-json">导出完整 JSON 备份</button><button class="button secondary" data-action="export-csv">导出逐组 CSV</button><button class="button secondary" data-action="report">导出复盘摘要，发给教练分析</button><p>云端读取最近1000次训练。导出后可以在聊天中上传，让我结合你的记录分析。</p>`)}
function allForExport(){const result=sessions.filter(s=>s.id!==current?.id);if(current&&(dirty||current.revision>0))result.push(current);return result.sort((a,b)=>b.date.localeCompare(a.date))}
function download(name,content,type){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('文件已导出')}
function exportJson(){download('FORM-training-'+today()+'.json',JSON.stringify({format:'form-training-v1',exportedAt:new Date().toISOString(),sessions:allForExport()},null,2),'application/json')}
function exportCsv(){const rows=[['日期','训练日','训练状态','动作','分类','计重方式','单侧','组','kg','次数','右次数','左次数','余力RIR','完成','不适','弹响','动作备注','训练备注']];for(const s of allForExport())for(const e of s.exercises)e.sets.forEach((t,i)=>rows.push([s.date,s.planId,s.status,e.name,e.group,modes[e.mode],e.unilateral?'是':'否',i+1,t.kg??'',t.reps??'',t.right??'',t.left??'',t.rir??'',t.done?'是':'否',e.pain,e.click?'是':'否',e.note,s.note]));const cell=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,"'$&").replaceAll('"','""')+'"';download('FORM-sets-'+today()+'.csv','\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function report(){const all=allForExport(),sum=summarize(all,today());let text=`# FORM 训练复盘资料\n导出日期：${today()}\n朋友版训练目标：胸、背、肩分化。个人身体信息未提供，本网站不诊断体态或伤病。\n\n## 本周摘要\n${JSON.stringify(sum,null,2)}\n\n## 记录\n`;
 for(const s of all){text+=`\n### ${s.date} · ${s.planId} · ${s.status==='finished'?'已结束':'草稿（不计入趋势）'}\n`;for(const e of s.exercises){text+=`- ${e.name}（${modes[e.mode]}，目标${e.targetSets}组×${e.min}—${e.max}次），不适${e.pain}/10，弹响${e.click?'有':'无'}\n`;e.sets.forEach((t,i)=>text+=`  - 第${i+1}组：${t.done?'完成':'未完成'}；${e.mode==='body'?'徒手':(t.kg??'未填')+'kg'}；${e.unilateral?'右'+(t.right??'未填')+' 左'+(t.left??'未填'):(t.reps??'未填')}次；余力${t.rir??'未填'}\n`);if(e.note)text+=`  - 备注：${e.note}\n`;}if(s.note)text+=`训练感受：${s.note}\n`;}
 text+='\n请根据真实记录分析执行情况、左右次数差、同动作的进步与恢复；不根据照片或弹响声诊断损伤。\n';download('FORM-review-'+today()+'.md',text,'text/markdown;charset=utf-8')}

 if(b.dataset.openSession){try{await flush()}catch{return toast('请先保存当前草稿。')}current=structuredClone(sessions.find(s=>s.id===b.dataset.openSession));view='train';render();window.scrollTo(0,0);return}

 if(action==='resolve-conflicts'){if(!confirm('保留云端版本，并把手机修改另存为一条独立训练记录，再同步。继续吗？'))return;try{await flush();await journal.resolveConflicts();current=null;await load();await syncCloud();toast('已保留两份记录，请在历史中核对，避免重复计入训练量。')}catch(err){toast(err.message)}return}
 if(action==='add-exercise')return addModal();

 if(action==='recover'){try{validateSession(recovery);if(dirty)await flush();const latest=sessions.find(s=>s.id===recovery.id);if(latest&&latest.revision!==recovery.revision){if(!confirm('云端版本已有变化。将把这份恢复草稿作为一条新记录保存，继续吗？'))return;recovery.id=uid();recovery.revision=0;}current=recovery;recovery=null;view='train';markDirty();render();toast('已恢复草稿，正在同步')}catch(err){toast('无法恢复：'+err.message)}return}

document.addEventListener('change',ev=>{
 const el=ev.target;
 if(el.id==='session-date'){if(!el.value||el.value>today()){el.value=current.date;return toast('请选择今天或之前的有效日期。')}current.date=el.value;markDirty();return}

 if(el.id==='history-from'){historyFrom=el.value;render();return}if(el.id==='history-plan'){historyPlan=el.value;render();return}if(el.id==='trend-select'){trendId=el.value;render();return}
 if(el.id==='add-library'){const custom=el.value==='custom';$('#custom-fields').hidden=!custom;$('#custom-name').required=custom;return}
 const e=current?.exercises.find(e=>e.id===el.closest('[data-exercise]')?.dataset.exercise);if(!e)return;
 if(el.dataset.field){const f=el.dataset.field;if(f==='mode'){if(e.sets.some(t=>t.done)&&!confirm('更改计重方式会清空该动作的重量和完成勾选，保留次数。继续吗？')){el.value=e.mode;return}e.mode=el.value;e.sets.forEach(t=>{t.kg=null;t.done=false});markDirty();render();return}e[f]=el.type==='checkbox'?el.checked:f==='pain'?Number(el.value):el.value;markDirty();return}
 if(el.dataset.setField){const t=e.sets.find(t=>t.id===el.closest('[data-set]').dataset.set),field=el.dataset.setField;
  if(field==='done'){if(el.checked){if(e.unilateral?!(t.left>0&&t.right>0):!(t.reps>0)){el.checked=false;return toast(e.unilateral?'先填写左右两侧实际次数。':'先填写实际完成次数。')}if(e.mode!=='body'&&t.kg===null){el.checked=false;return toast('先填写重量；无负重请切换“徒手”。')}}t.done=el.checked;el.closest('[data-set]').classList.toggle('completed',t.done);}
  else{const n=number(el.value),max=field==='kg'?1000:field==='rir'?10:300;if(n!==null&&(!Number.isFinite(n)||n<0||n>max||(field!=='kg'&&!Number.isInteger(n)))){el.value=t[field]??'';return toast('请输入有效数值；次数和余力使用整数。')}t[field]=n;if(t.done&&((e.unilateral?!(t.left>0&&t.right>0):!(t.reps>0))||(e.mode!=='body'&&t.kg===null))){t.done=false;const row=el.closest('[data-set]');row.classList.remove('completed');row.querySelector('[data-set-field=done]').checked=false;}}
  markDirty();updateProgress();
 }

document.addEventListener('input',ev=>{const el=ev.target;if(el.id==='library-search'){libraryQuery=el.value;$('#library-results').innerHTML=libraryResults();return}if(el.id==='session-note'){current.note=el.value;markDirty();return}if(el.dataset.field==='note'){const e=current.exercises.find(e=>e.id===el.closest('[data-exercise]').dataset.exercise);e.note=el.value;markDirty()}});
document.addEventListener('submit',async ev=>{if(!['add-form','new-form'].includes(ev.target.id))return;ev.preventDefault();
 if(ev.target.id==='new-form'){try{await flush();current=makeSession($('#new-plan').value,$('#new-date').value);view='train';$('#modal').close();render();window.scrollTo(0,0)}catch(err){toast(err.message)}return}
 if(ev.target.id==='add-form'){if(current.exercises.length>=50)return toast('每次训练最多50个动作。');const id=$('#add-library').value,n=Number($('#custom-sets').value),reps=Number($('#custom-reps').value);if(!Number.isInteger(n)||n<1||n>20||!Number.isInteger(reps)||reps<1||reps>300)return toast('请输入有效组数和次数。');let e;
  if(id==='custom'){const name=$('#custom-name').value.trim();if(!name)return toast('请填写动作名称');e={id:uid(),exerciseId:'custom-'+uid(),name,group:$('#custom-group').value,mode:$('#custom-mode').value,unilateral:$('#custom-unilateral').checked,targetSets:n,min:reps,max:reps,extra:true,note:'',pain:0,click:false,sets:Array.from({length:l.superset?0:n},setFactory)};}
  else if(findLib(id)){e=makeExercise([id,n,reps,reps],true);e.targetSets=n;e.sets=Array.from({length:n},setFactory);}
  else{const prev=sessions.flatMap(s=>s.exercises).find(e=>e.exerciseId===id);if(!prev)return toast('未找到动作');e={...structuredClone(prev),id:uid(),targetSets:n,min:reps,max:reps,extra:true,note:'',pain:0,click:false,sets:Array.from({length:l.superset?0:n},setFactory)};}
  current.exercises.push(e);markDirty();$('#modal').close();render();toast('动作已加入，可以开始记录');
 }
});
window.addEventListener('beforeunload',ev=>{if(dirty){localCopy();ev.preventDefault();ev.returnValue=''}});
window.addEventListener('online',async()=>{try{await flush();await syncCloud()}catch{}});window.addEventListener('offline',()=>{status('离线 · 记录保存在手机');localCopy()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncCloud();else if(dirty)flush().catch(()=>{});});
async function load(){const data=await api('/api/bootstrap');sessions=data.sessions;if(accessKey)try{localStorage.setItem('form-friend-access-key',accessKey)}catch{}if(!current)current=structuredClone(sessions.find(s=>s.date===today()&&s.status==='draft')||makeSession());status('已连接云端');loadError='';render()}
document.addEventListener('submit',async ev=>{if(ev.target.id!=='access-form')return;ev.preventDefault();let key=$('#access-input').value.trim();try{if(key.includes('#'))key=new URLSearchParams(new URL(key).hash.slice(1)).get('access')||'';}catch{}if(!/^[A-Za-z0-9_-]{40,100}$/.test(key)){$('#access-error').textContent='请粘贴完整的专属链接或有效口令。';return}accessKey=key;const button=ev.target.querySelector('button');button.disabled=true;try{await load()}catch(error){button.disabled=false;$('#access-error').textContent=error.message;}});
try{await load()}catch(error){accessGate(error.status===401?'':error.message)}
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register(new URL('sw.js',document.baseURI)).then(()=>navigator.serviceWorker.ready).then(()=>{offlineReady=true;syncIndicator();navigator.storage?.persist?.().catch(()=>{});}).catch(()=>{offlineReady=false;syncIndicator();});}
